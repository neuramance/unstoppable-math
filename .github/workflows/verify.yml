name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: nohup bash -c 'bunx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta && touch /tmp/supabase-ready' > /tmp/supabase.log 2>&1 &
      - run: scripts/agent-verify
      - run: |
          for i in $(seq 1 120); do [ -f /tmp/supabase-ready ] && exit 0; sleep 2; done
          cat /tmp/supabase.log
          exit 1
      - run: bun run test:db
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
